version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: backend
    depends_on:
      - postgres
    env_file:
      - ./backend/.env
    ports:
      - "3001:3001"
    command: sh -c "sleep 5 && npx prisma db push && node dist/index.js"

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
